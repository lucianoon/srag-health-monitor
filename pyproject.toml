[project]
name = "srag-health-monitor"
version = "0.1.0"
description = "Monitoramento de SRAG com indicadores determinísticos, API, worker e relatórios automatizados"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # AI/ML
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "openai>=1.0.0",
    # Dados
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Visualização
    "matplotlib>=3.7.0",
    # Coleta
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    # Utilidades
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests",
    "types-beautifulsoup4",
]

[tool.uv]
# O código em src/ é um conjunto de módulos carregado via PYTHONPATH, não um
# pacote instalável: o uv só gerencia o ambiente.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
# UP042 pediria StrEnum no lugar de (str, Enum). Isso muda o que str(Membro)
# devolve, e o código usa tanto o membro quanto o .value — mudança de
# comportamento, não de estilo.
ignore = ["UP042"]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Query()/Depends() no default de argumento é o idioma do FastAPI, não um bug.
"src/api/app.py" = ["B008"]
# Linhas longas dentro de templates markdown do relatório e de fixtures XML:
# quebrá-las mudaria o texto gerado / o payload de teste, não a formatação.
"src/agents/report_writer_agent.py" = ["E501"]
"tests/test_tools.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py", "ingest.py", "worker.py"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
